<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klinik Puri Medika - Dashboard Pelayanan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #213145; color: white; font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; z-index: 9999;">
        <div style="margin-bottom: 1.5rem; display: flex; flex-direction: column; align-items: center; animation: fade-in-bottom 0.5s cubic-bezier(0.390, 0.575, 0.565, 1.000) both; animation-delay: 0.1s;">
          <div style="background: white; width: 6.5rem; height: 6.5rem; padding: 1rem; border-radius: 1.25rem; box-shadow: 0 16px 40px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem;">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 4rem; height: 4rem;">
              <rect x="2" y="4" width="20" height="16" rx="4" fill="#213145" />
              <path d="M12 7v10M7 12h10" stroke="#CCDCEF" stroke-width="2.5" stroke-linecap="round" />
            </svg>
          </div>
          <h1 style="font-size: 1.75rem; font-weight: 800; margin: 0 0 0.25rem 0; letter-spacing: -0.02em; text-align: center;">Klinik Puri Medika<span style="color: #FF8574;">.</span></h1>
          <p style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #B8C8DB; margin: 0;">Sistem Informasi &amp; Pelayanan Klinik</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      @keyframes fade-in-bottom {
        0% { transform: translateY(30px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
    </style>
  </body>
</html>
